<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120c09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ma Cave">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Ma Cave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">❦</span>
      <div>
        <div class="brand-title">Ma Cave</div>
        <div class="brand-sub"><span id="brand-sub">—</span> <span id="sync" class="sync"></span></div>
      </div>
    </div>
    <nav class="racks-nav" id="racks-nav" aria-label="Meubles de la cave"></nav>
    <div class="actions">
      <div class="search">
        <input id="search" type="search" placeholder="Rechercher…" autocomplete="off">
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <button class="btn hidden" id="btn-import"></button>
      <button class="btn ghost" id="btn-dashboard">Tableau de bord</button>
      <button class="btn gold" id="btn-add">＋ Ajouter</button>
      <button class="btn icon" id="btn-settings" title="Réglages" aria-label="Réglages">⚙</button>
    </div>
  </header>

  <div id="placement-banner" class="banner hidden">
    <span id="placement-text"></span>
    <button class="btn ghost small" id="placement-cancel">Annuler</button>
  </div>

  <aside id="sheet" class="sheet hidden" aria-live="polite"></aside>
  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <div id="loading" class="loading">
    <div class="loading-mark">❦</div>
    <div>Ouverture de la cave…</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
